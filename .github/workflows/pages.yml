# Publica o mapa no GitHub Pages. A chave do Google Maps vem do segredo do repositório
# GOOGLE_MAPS_BROWSER_KEY e só entra no config.js gerado aqui (window.RADAR_MAPS_KEY, lido pelo
# index.html); ela não fica nos arquivos do repositório nem aparece no log.
#
# Requisitos no repositório:
#   - Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   - Settings → Secrets and variables → Actions → segredo GOOGLE_MAPS_BROWSER_KEY
name: Publicar mapa

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      aceitar_queda:
        description: "Publicar mesmo com queda de mais de 10% no total ou nos pontos exatos (só se a queda for real)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Gerar config.js com a chave do Google Maps
        env:
          GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_KEY }}
        run: |
          # Sem a chave o mapa não abre: falha aqui em vez de publicar um site quebrado.
          if [ -z "${GOOGLE_MAPS_BROWSER_KEY}" ]; then
            echo "::error title=Chave ausente::O segredo GOOGLE_MAPS_BROWSER_KEY não está definido (ou está vazio). Crie-o em Settings → Secrets and variables → Actions e rode o workflow de novo."
            exit 1
          fi
          node -e 'require("fs").writeFileSync("config.js", "window.RADAR_MAPS_KEY = " + JSON.stringify(process.env.GOOGLE_MAPS_BROWSER_KEY) + ";\n")'
          # Confere o arquivo gerado sem mostrar a chave no log.
          node -e 'global.window = {}; require("./config.js"); if (typeof window.RADAR_MAPS_KEY !== "string" || !window.RADAR_MAPS_KEY) { console.error("config.js gerado sem window.RADAR_MAPS_KEY"); process.exit(1); } console.log("config.js gerado: window.RADAR_MAPS_KEY definida (" + window.RADAR_MAPS_KEY.length + " caracteres)")'

      # Segunda barreira (a primeira é o robô): dados inválidos ou com queda grande em relação ao que
      # está no ar não são publicados, e o site continua com a última versão válida.
      - name: Validar imoveis.json
        env:
          ACEITAR_QUEDA: ${{ inputs.aceitar_queda }}
        run: |
          if curl -fsS -m 60 -o /tmp/publicado.json "https://willianloreno.github.io/radar-leiloes-mapa/imoveis.json?t=$(date +%s)"; then
            ANTERIOR="--anterior /tmp/publicado.json"
          else
            echo "::warning::Não consegui baixar a versão publicada; validando sem comparar."
            ANTERIOR=""
          fi
          TOL=""
          [ "${ACEITAR_QUEDA}" = "true" ] && TOL="--tolerancia 1"
          if ! node scripts/validar-imoveis.js imoveis.json $ANTERIOR $TOL; then
            echo "::error title=Dados inválidos::imoveis.json não passou na validação; o site continua com a versão anterior."
            exit 1
          fi

      - name: Montar o site
        run: |
          for f in index.html imoveis.json config.js; do
            [ -s "$f" ] || { echo "::error::Arquivo $f ausente ou vazio."; exit 1; }
          done
          mkdir _site
          cp index.html config.js imoveis.json .nojekyll _site/

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5
        # Se falhar com "Not Found": ative Settings → Pages → Source: "GitHub Actions" e rode de novo.

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
